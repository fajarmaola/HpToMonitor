name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

# Core components (native DLL, C# tests, Core, Desktop, publish) MUST fail the workflow if
# they fail — no continue-on-error, no optional steps. The IddCx driver is a SEPARATE job so
# its outcome is reported independently (compile vs. signing vs. runtime are different things).

jobs:
  windows-core:
    name: Core / Desktop / Native / Tests / EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: C - Build native DLL (DXGI capture + Media Foundation H.264)
        run: |
          cmake -S windows/SecondScreen.Native -B windows/SecondScreen.Native/build -A x64
          cmake --build windows/SecondScreen.Native/build --config Release
          if (!(Test-Path windows/SecondScreen.Native/build/Release/SecondScreen.Native.dll)) { throw "Native DLL not produced" }

      - name: C# TESTS - crypto/protocol vectors (same as Android)
        run: dotnet test windows/SecondScreen.Tests/SecondScreen.Tests.csproj -c Release --logger "trx;LogFileName=results.trx"

      - name: A/B - Build Core + Desktop (WPF)
        env:
          SSL_NATIVE_DLL: ${{ github.workspace }}\windows\SecondScreen.Native\build\Release\SecondScreen.Native.dll
        run: dotnet build windows/SecondScreenLocal.sln -c Release

      - name: D - Publish self-contained SecondScreenLocal.exe
        env:
          SSL_NATIVE_DLL: ${{ github.workspace }}\windows\SecondScreen.Native\build\Release\SecondScreen.Native.dll
        run: |
          dotnet publish windows/SecondScreen.Desktop/SecondScreen.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
          copy windows\SecondScreen.Native\build\Release\SecondScreen.Native.dll publish\
          if (!(Test-Path publish/SecondScreenLocal.exe)) { throw "SecondScreenLocal.exe not produced" }

      - name: Upload SecondScreenLocal-Windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreenLocal-Windows-x64
          path: publish/
          if-no-files-found: error

  windows-driver:
    name: IddCx driver compile (WDK)
    runs-on: windows-latest
    # NOT continue-on-error: a genuine compile failure makes THIS job red so it is visible.
    # Core artifacts are unaffected (separate job). Signing/runtime are handled separately below.
    steps:
      - uses: actions/checkout@v4

      - name: Install Windows Driver Kit (WDK)
        shell: pwsh
        run: |
          # WDK content + matching SDK components for the UMDF/IddCx toolset.
          choco install windowsdriverkit11 -y --no-progress
          # Integrate the WDK into the installed Visual Studio (provides wudfwdm.h + UMDF toolset).
          $vsix = Get-ChildItem "C:\Program Files*\Windows Kits\10\Vsix" -Recurse -Filter "WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -First 1
          $installer = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\Common7\IDE\VSIXInstaller.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vsix -and $installer) { & $installer.FullName /quiet /admin $vsix.FullName; echo "WDK VSIX installed" } else { echo "WDK VSIX not found (WDK content likely absent on this runner)" }
          echo "WDK install step completed"

      - name: DRIVER_COMPILE - build IddCx driver (x64/Release), no signing
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"
          rem vcvars sets WindowsSDKVersion (with trailing backslash) to the installed SDK; use it
          set "SDKVER=%WindowsSDKVersion:\=%"
          echo Using Windows SDK version: %SDKVER%
          msbuild windows\SecondScreen.DisplayDriver\SecondScreen.DisplayDriver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:WindowsTargetPlatformVersion=%SDKVER%
          if not exist "windows\SecondScreen.DisplayDriver\x64\Release\SecondScreenDisplay\SecondScreenDisplay.dll" if not exist "windows\SecondScreen.DisplayDriver\x64\Release\SecondScreenDisplay.dll" (echo DRIVER_COMPILE_FAILED & exit /b 1)
          echo DRIVER_COMPILE_SUCCESS

      - name: DRIVER_SIGNING_REQUIRED (informational)
        run: echo "Signing is a SEPARATE step. Test signing needs a local test cert; distribution needs an EV cert + MS attestation. Not performed in CI."

      - name: DRIVER_RUNTIME_TEST_REQUIRED (informational)
        run: echo "Loading the driver + enumerating Display 2 requires a real Windows machine with test signing enabled. Not possible on hosted runners."

      - name: Upload SecondScreenLocal-DisplayDriver
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SecondScreenLocal-DisplayDriver
          path: windows/SecondScreen.DisplayDriver/x64/Release/
          if-no-files-found: error
